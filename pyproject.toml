[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm-failsafe"
version = "0.1.0"
description = "Failure prediction and adaptive track weighting for sparse 3D reconstruction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "opencv-python>=4.8",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "scipy>=1.11",
  "Pillow>=10.0",
  "py7zr>=0.20",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
