name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Headless OpenCV avoids libGL requirements on GitHub runners.
          pip uninstall -y opencv-python
          pip install opencv-python-headless
          pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest -q
      - name: Build a small PDF report smoke test
        run: python -c "import sfm_failsafe.pdf_report as p; print('reportlab available:', p.REPORTLAB_AVAILABLE)"
